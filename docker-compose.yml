version: "3.8"

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: jobly-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - jobly-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: jobly-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - jobly-network
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 5

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: jobly-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-jobly}
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./script/mongo-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
      - ./script/seed_data.js:/docker-entrypoint-initdb.d/02-seed_data.js:ro
    networks:
      - jobly-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Seed Runner (runs after MongoDB is healthy)
  mongodb-seed:
    image: mongo:7.0
    container_name: jobly-mongodb-seed
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:-jobly_user}
      DB_PASSWORD: ${DB_PASSWORD:-jobly_password_2024}
      DATABASE_NAME: ${DATABASE_NAME:-jobly}
    volumes:
      - ./script/seed_data.js:/seed_data.js:ro
    networks:
      - jobly-network
    command: sh -c "echo 'Waiting for MongoDB to be ready...' && sleep 10 && echo 'Running seed script...' && mongosh --host mongodb --username $$DB_USERNAME --password $$DB_PASSWORD --authenticationDatabase $$DATABASE_NAME $$DATABASE_NAME /seed_data.js && echo 'Seed data completed!'"
    restart: "no"

  # Milvus - Vector Database
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: jobly-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - jobly-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: jobly-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9010:9000" # Minio API (changed from 9000)
      - "9011:9001" # Minio Console (changed from 9001)
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - jobly-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: jobly-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530" # Milvus gRPC port
      - "19121:9091" # Milvus metrics (changed from 9091)
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    networks:
      - jobly-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Attu - Milvus Web UI
  attu:
    image: zilliz/attu:v2.4
    container_name: jobly-attu
    ports:
      - "3030:3000" # Attu Web UI (avoiding 3000)
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - jobly-network
    restart: unless-stopped

  # JoblyBE Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobly-app
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongodb-seed:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "9099:9090" # gRPC port (changed from 9090 to avoid conflicts)
    environment:
      # Server
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      RESUME_PARSER_URL: ${RESUME_PARSER_URL:-http://parser-service:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Database
      DATABASE_SOURCE: mongodb://${DB_USERNAME:-jobly_user}:${DB_PASSWORD:-jobly_password_2024}@mongodb:27017/${DATABASE_NAME:-jobly}
      DATABASE_NAME: ${DATABASE_NAME:-jobly}

      # Milvus
      MILVUS_ADDRESS: milvus:19530
      MILVUS_DB_NAME: ${MILVUS_DB_NAME:-default}

      # Kafka
      KAFKA_BROKERS: kafka:9093
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      KAFKA_ENABLE_SASL: ${KAFKA_ENABLE_SASL:-false}
      KAFKA_RESUME_PARSE_TOPIC: ${KAFKA_RESUME_PARSE_TOPIC:-resume-parse-jobs}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-resume-parser-group}
    networks:
      - jobly-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  jobly-network:
    driver: bridge

volumes:
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  milvus-etcd-data:
    driver: local
  milvus-minio-data:
    driver: local
  milvus-data:
    driver: local
